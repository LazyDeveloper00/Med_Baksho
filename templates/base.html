{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            MediBaksho
        {% endblock %}
    </title>


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/layout.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/components.css' %}"
    >


    <!-- Page-specific CSS -->
    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <!-- ================================
         NAVBAR
         ================================ -->

    {% include "includes/navbar.html" %}


    <!-- ================================
         MESSAGES
         ================================ -->

    {% include "includes/messages.html" %}


    <!-- ================================
         PAGE CONTENT
         ================================ -->

    {% block content %}
    {% endblock %}


    <!-- ================================
         FOOTER
         ================================ -->

    {% include "includes/footer.html" %}


    <!-- Page-specific JavaScript (optional; the app is fully server-rendered) -->
    {% block extra_js %}
    {% endblock %}

</body>

</html>
