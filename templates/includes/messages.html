{% if messages %}
    <div class="messages-container">

        {% for message in messages %}

            <div class="message message-{{ message.tags }}">

                <div class="message-content">
                    {{ message }}
                </div>

                <button
                    type="button"
                    class="message-close"
                    aria-label="Close message"
                    onclick="this.parentElement.remove();"
                >
                    ×
                </button>

            </div>

        {% endfor %}

    </div>
{% endif %}
